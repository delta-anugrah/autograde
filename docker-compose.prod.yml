# Override PRODUKSI — dipakai bersama docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# (atau `make up-prod`).
#
# Tujuan: HAPUS bind-mount source `.:/app` dan `/videos` yang ada di
# docker-compose.yml (itu pola DEV supaya `make restart` cukup tanpa rebuild).
# Di produksi kita mau IMAGE IMMUTABLE: yang jalan = persis image yang di-build,
# bukan working-tree host — rollback jadi deterministik, `git pull` di tengah
# operasi tidak mengubah service yang sedang jalan.
#
# Default Compose MERGE (union) daftar volumes antar-file — jadi override biasa
# TIDAK bisa menghapus mount. Tag `!override` memaksa daftar di bawah MENGGANTI
# seluruh daftar volumes service (bukan append). Cukup daftarkan mount yang MEMANG
# mau dipertahankan di prod: artifacts (output runtime), models read-only, engines
# (cache TensorRT). `.:/app` dan `/videos` sengaja TIDAK didaftarkan → hilang di prod.

services:
  ripe-line-1:
    volumes: !override
      - ./artifacts/line-1:/app/artifacts
      - ./state/line-1:/app/state
      - ./models:/app/models:ro
      - ./engines:/app/engines

  ripe-line-2:
    volumes: !override
      - ./artifacts/line-2:/app/artifacts
      - ./state/line-2:/app/state
      - ./models:/app/models:ro
      - ./engines:/app/engines

  ripe-line-3:
    volumes: !override
      - ./artifacts/line-3:/app/artifacts
      - ./state/line-3:/app/state
      - ./models:/app/models:ro
      - ./engines:/app/engines

  console:
    # Image dari GHCR, bukan build lokal. `docker-compose.yml` menyebut
    # `palmgrade-vision:latest` + sebuah blok `build:` karena di laptop
    # developer konsol memang dibangun dari working tree. PC pabrik tidak punya
    # source code sama sekali, jadi tanpa baris ini compose mencoba MEM-BUILD
    # dan mati dengan "Dockerfile not found" — persis jebakan yang sudah
    # tercatat untuk tiga line.
    image: ${PALMGRADE_AUTOGRADE_IMAGE:-palmgrade-vision:latest}
    # 8100, bukan 8000. Dengan `network_mode: host` port itu milik host apa
    # adanya, dan 8000 adalah port bench Frappe — satu PC yang kelak juga
    # menjalankan ERP lokal akan bentrok diam-diam: yang kalah start hanya
    # gagal mengikat port, dan operator melihat layar yang tidak pernah terbuka.
    # Bentuk LIST, bukan map. `docker-compose.yml` menulis environment konsol
    # sebagai list (`- APP_MODE=console`), dan Compose lama tidak menggabungkan
    # dua bentuk yang berbeda: map MENGGANTIKAN seluruh list, bukan menambahinya.
    # Akibatnya `APP_MODE` hilang, entrypoint jatuh ke `main.py` (jalur line),
    # dan konsol mati mencari model YOLO yang memang tidak dipasang untuknya.
    environment:
      - APP_PORT=8100
    volumes: !override
      - ./state/console:/app/state
      - ./artifacts/line-1:/app/artifacts/line-1:ro
      - ./artifacts/line-2:/app/artifacts/line-2:ro
      - ./artifacts/line-3:/app/artifacts/line-3:ro
