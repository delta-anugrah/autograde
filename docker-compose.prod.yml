# Override PRODUKSI — dipakai bersama docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# (atau `make up-prod`).
#
# Tujuan: HAPUS bind-mount source `.:/app` dan `/videos` yang ada di
# docker-compose.yml (itu pola DEV supaya `make restart` cukup tanpa rebuild).
# Di produksi kita mau IMAGE IMMUTABLE: yang jalan = persis image yang di-build,
# bukan working-tree host — rollback jadi deterministik, `git pull` di tengah
# operasi tidak mengubah service yang sedang jalan.
#
# Default Compose MERGE (union) daftar volumes antar-file — jadi override biasa
# TIDAK bisa menghapus mount. Tag `!override` memaksa daftar di bawah MENGGANTI
# seluruh daftar volumes service (bukan append). Cukup daftarkan mount yang MEMANG
# mau dipertahankan di prod: artifacts (output runtime), models read-only, engines
# (cache TensorRT). `.:/app` dan `/videos` sengaja TIDAK didaftarkan → hilang di prod.

services:
  ripe-line-1:
    volumes: !override
      - ./artifacts/line-1:/app/artifacts
      - ./state/line-1:/app/state
      - ./models:/app/models:ro
      - ./engines:/app/engines
      # Berkas video/foto yang dipilih layar Support. `!override` MENGGANTI
      # daftar, jadi mount ini hilang di pabrik kalau tidak ditulis ulang di sini.
      - ./media:/media:ro

  ripe-line-2:
    volumes: !override
      - ./artifacts/line-2:/app/artifacts
      - ./state/line-2:/app/state
      - ./models:/app/models:ro
      - ./engines:/app/engines
      # Berkas video/foto yang dipilih layar Support. `!override` MENGGANTI
      # daftar, jadi mount ini hilang di pabrik kalau tidak ditulis ulang di sini.
      - ./media:/media:ro

  ripe-line-3:
    volumes: !override
      - ./artifacts/line-3:/app/artifacts
      - ./state/line-3:/app/state
      - ./models:/app/models:ro
      - ./engines:/app/engines
      # Berkas video/foto yang dipilih layar Support. `!override` MENGGANTI
      # daftar, jadi mount ini hilang di pabrik kalau tidak ditulis ulang di sini.
      - ./media:/media:ro

  console:
    # Semua yang konsol butuhkan ditulis ULANG di sini, bukan ditambahkan.
    #
    # Compose 2.x membuang seluruh blok dasar sebuah service begitu override
    # menyebut kunci yang sama — bukan menggabungkannya. Ini terbukti di PC
    # Lampung (Compose v2.40.3): dari 18 variabel environment yang ada di
    # `docker-compose.yml`, hanya 4 yang sampai ke container, dan yang 4 itu
    # persis yang ditulis di override. `network_mode` dan `container_name` ikut
    # hilang dengan cara yang sama.
    #
    # Empat kegagalan yang lahir dari satu sebab ini, semuanya senyap:
    #   1. `APP_MODE` hilang  → entrypoint jatuh ke `main.py` (jalur line) dan
    #      konsol mati mencari model YOLO yang memang tidak dipasang untuknya.
    #   2. `network_mode: host` hilang → uvicorn bind 8100 DI DALAM container;
    #      dari host port itu tidak ada sama sekali, dan browser operator cuma
    #      dapat "Unable to connect".
    #   3. `CONSOLE_*_HASH` hilang → layar login bilang "Belum ada operator"
    #      walaupun hash-nya sudah benar di `.env`.
    #   4. `container_name` hilang → container jadi `<project>-console-1`.
    #
    # Tidak terlihat di MacBook karena Compose di sana v5.5.1 menggabungkan
    # keduanya dengan benar: `docker compose config` di mesin dev tetap
    # memunculkan `APP_MODE: console` untuk versi yang rusak sekalipun.
    #
    # ⚠️ Menambah environment konsol berarti menambahnya DI SINI juga, kalau
    # tidak variabel itu tidak akan pernah sampai ke PC pabrik.
    image: ${PALMGRADE_AUTOGRADE_IMAGE:-palmgrade-vision:latest}
    container_name: palmgrade_console
    network_mode: host
    # 8100, bukan 8000. Dengan `network_mode: host` port itu milik host apa
    # adanya, dan 8000 adalah port bench Frappe — satu PC yang kelak juga
    # menjalankan ERP lokal akan bentrok diam-diam.
    environment:
      - APP_MODE=console
      - APP_PORT=8100
      - APP_ENV=${APP_ENV:-production}
      - APP_VERSION=${APP_VERSION:-unknown}
      - BACKEND_API_VER=${BACKEND_API_VER:-/api/v1}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-supersecret123}
      - FACTORY_TZ=${FACTORY_TZ:-Asia/Jakarta}
      - CONSOLE_SYNC_INTERVAL_S=${CONSOLE_SYNC_INTERVAL_S:-300}
      - CONSOLE_LINE_HOST=${CONSOLE_LINE_HOST:-http://localhost}
      - CONSOLE_DEFAULT_HASH=${CONSOLE_DEFAULT_HASH:-}
      - CONSOLE_SUPPORT_HASH=${CONSOLE_SUPPORT_HASH:-}
      - ERP_URL=${ERP_URL:-}
      - ERP_API_KEY=${ERP_API_KEY:-}
      - ERP_API_SECRET=${ERP_API_SECRET:-}
      - ERP_COMPANY=${ERP_COMPANY:-}
      - ERP_ALLOWED_ROLES=${ERP_ALLOWED_ROLES:-support}
      - LOG_RETENSI_HARI=${LOG_RETENSI_HARI:-180}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_BUCKET=${R2_BUCKET:-}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL:-}
      - LICENSE_TOKEN=${LICENSE_TOKEN:-}
      - LINE_1_MACHINE_ID=${LINE_1_MACHINE_ID:-d1f9c7b2-8e5a-4c3b-9a1e-2f6d4c8e7b01}
      - LINE_2_MACHINE_ID=${LINE_2_MACHINE_ID:-a7e2f4c9-3b6d-4e1a-8c5f-9d2b6a1e4f02}
      - LINE_3_MACHINE_ID=${LINE_3_MACHINE_ID:-ad5f7bb9-c06d-4e87-8282-ce450ae331ec}
      # Folder media + berkas setelan yang ditulis layar Support. Tanpa ketiganya
      # layar Sumber Kamera tampil, menerima pilihan, dan tidak melakukan apa pun:
      # daftar berkasnya kosong selamanya dan simpannya menulis ke path yang tidak
      # ada di dalam container.
      - MEDIA_DIR=${MEDIA_DIR:-/media}
      - MEDIA_ENV_PATH=${MEDIA_ENV_PATH:-/config/media.env}
      - MEDIA_FILE=${MEDIA_FILE:-}
    volumes: !override
      - ./state/console:/app/state
      - ./artifacts/line-1:/app/artifacts/line-1:ro
      - ./artifacts/line-2:/app/artifacts/line-2:ro
      - ./artifacts/line-3:/app/artifacts/line-3:ro
      # Daftar berkas yang layar Sumber Kamera tawarkan.
      - ./media:/media:ro
      # Satu-satunya berkas host yang konsol boleh TULIS. `.env` sengaja tidak
      # di-mount: ia memuat lisensi, R2, dan webhook secret.
      - ./media.env:/config/media.env
