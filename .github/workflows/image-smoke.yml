name: Smoke Test AutoGrade Image

# Batch 4.2: an image is checked on a fresh runner before it gets its release tag.
#
# deploy.yml and demo-image.yml build under a temporary `candidate-*` tag, call this
# workflow with the image digest, and only copy the digest to `vX.Y.Z` (and `latest`)
# when every check here passed. Factory PCs update from `latest` alone and read the
# version from the image label, so a candidate tag is never seen by a factory PC.
#
# Manual run (trial mode): smoke any image that already exists, for example
# `ghcr.io/delta-anugrah/autograde:v1.21.0-cpu`. It only reads: no tag is written,
# this workflow has no `packages: write`.
# The Run workflow button appears only once this file is on `main`, the repository's
# default branch on GitHub; until the first release PR after batch 4.2 it is not there.

on:
  workflow_call:
    inputs:
      image:
        description: "Image to check, by digest (ghcr.io/...@sha256:...) or tag"
        required: true
        type: string
      version:
        description: "APP_VERSION the console must report, e.g. v1.22.0"
        required: true
        type: string
      label:
        description: "Expected org.opencontainers.image.version label, e.g. v1.22.0 or v1.22.0-cpu"
        required: true
        type: string
      demo:
        description: "CPU demo image: also boot it through the droplet kit"
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      image:
        description: "Image to check, e.g. ghcr.io/delta-anugrah/autograde:v1.21.0-cpu"
        required: true
      version:
        description: "APP_VERSION the console must report, e.g. v1.21.0"
        required: true
      label:
        description: "Expected version label, e.g. v1.21.0-cpu"
        required: true
      demo:
        description: "CPU demo image"
        type: boolean
        default: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    # Pulling the factory image (about 18 GB unpacked) takes minutes; a hang must not
    # hold the runner for GitHub's 6-hour default.
    timeout-minutes: 45

    permissions:
      contents: read
      packages: read

    # Inputs reach the shell only through env, never as `${{ inputs.* }}` inside `run:`.
    env:
      IMAGE: ${{ inputs.image }}
      APP_VERSION_EXPECTED: ${{ inputs.version }}
      LABEL_EXPECTED: ${{ inputs.label }}

    steps:
      # Called from a release: this is the tag commit, the same code as the image. Run by
      # hand: the scripts come from the branch picked in the Run workflow form, which may be
      # newer than the image being checked.
      - uses: actions/checkout@v4

      # Same reason as the factory build in deploy.yml: the CUDA image does not fit on
      # a hosted runner next to the toolchains it never uses.
      - name: Reclaim runner disk
        if: ${{ !inputs.demo }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Only pytest: the image tests talk to docker, the code under test is in the image.
      - name: Install pytest
        run: pip install pytest==9.1.1

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        run: docker pull "$IMAGE"

      - name: Smoke (label, imports, console boot)
        run: python scripts/smoke_image.py "$IMAGE" --version "$APP_VERSION_EXPECTED" --label "$LABEL_EXPECTED"

      # `E2E_WAJIB=1`: a test that would skip itself (no image, no docker) fails instead,
      # so this step can never turn green without having run.
      - name: Tracker works offline
        env:
          E2E_IMAGE: ${{ inputs.image }}
          E2E_WAJIB: "1"
        run: pytest tests/e2e/test_image_tracker_deps.py -rs -p no:cacheprovider

      - name: Demo kit boots, seeds and serves a login
        if: ${{ inputs.demo }}
        env:
          E2E_DEMO_IMAGE: ${{ inputs.image }}
          E2E_WAJIB: "1"
        run: pytest tests/e2e/test_demo_kit_docker.py -rs -p no:cacheprovider
