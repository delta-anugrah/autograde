name: CI

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # No torch/opencv/SDK on purpose: unit tests are pure logic, so CI stays
      # fast and needs no GPU. The rest are light pure-python wheels.
      - name: Install tooling
        # pyyaml is test-only, like ruff and pytest: it is how the compose file
        # is read back and checked against the settings the console reads.
        # fastapi is here for one guard (Fase 4): every operator lane must refuse a
        # request without a session, and that can only be proven against a real app.
        # Still no torch, cv2 or SDK — those stay out of CI.
        # python-dotenv comes in with `console_main`, which the lifespan test imports
        # to prove the startup warnings fire. Still no torch, cv2 or SDK.
        # opencv-python-headless arrived with the e2e step below. Eight PLC lane tests
        # reach `internal_controller` -> `core/constants.py` -> `cv2`; their own
        # docstrings say they live in tests/e2e/ because that folder "is not CI-gated,
        # so it can afford the real import". Now that it is gated, the import has to
        # resolve. `headless` is the no-GUI wheel (~35 MB, no X11) and it does NOT pull
        # torch -- the line that must not change is still "no torch, no SDK in CI".
        run: pip install ruff pytest cryptography aiosqlite psutil httpx boto3 pydantic pyyaml fastapi segno python-dotenv opencv-python-headless

      # Lint covers only modules already cleaned up; widen it one module at a time.
      - name: Ruff (lint)
        run: ruff check tests/ src/palmgrade/domain/ src/palmgrade/integrations/erp/ src/palmgrade/integrations/outbox/ src/palmgrade/integrations/upload/ src/palmgrade/license/ src/palmgrade/plc/ src/palmgrade/workers/batch_upload_worker.py src/palmgrade/workers/master_data_worker.py src/palmgrade/workers/erp_outbox_worker.py src/palmgrade/workers/erp_link.py src/palmgrade/workers/visit_resend_worker.py src/palmgrade/services/erp_queue.py src/palmgrade/services/auth_service.py src/palmgrade/services/operator_admin.py src/palmgrade/integrations/notifications/line_client.py src/palmgrade/repositories/console_repository.py src/palmgrade/services/capture_writer.py src/palmgrade/services/console_service.py src/palmgrade/routes/console.py src/palmgrade/console_main.py

      - name: Pytest (unit)
        run: pytest tests/unit/

      # The e2e suite guards the paths that move money and metal: the ERP sync, the
      # gate QR scan, truck reconciliation and the PLC coil trigger. It was written
      # but never wired into CI, so a regression in any of them reached `staging`
      # with every check green -- which is exactly what happened to the weigh-out
      # lane, red for a full day before anyone noticed (fixed in #96).
      #
      # It needs no GPU, no camera and no SDK: the tests that require a live ERP or
      # a docker image skip themselves. Measured on this suite, 129 pass and 12 skip
      # in about 40 seconds, so nothing here slows a PR down meaningfully.
      #
      # `-rs` prints why each test skipped. Without it a suite that silently stopped
      # running anything would still report success, which is the failure this whole
      # step exists to prevent.
      - name: Pytest (e2e)
        run: pytest tests/e2e/ -rs
