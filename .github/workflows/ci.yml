name: CI

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # No torch/opencv/SDK on purpose: unit tests are pure logic, so CI stays
      # fast and needs no GPU. The rest are light pure-python wheels.
      - name: Install tooling
        # pyyaml is test-only, like ruff and pytest: it is how the compose file
        # is read back and checked against the settings the console reads.
        # fastapi is here for one guard (Fase 4): every operator lane must refuse a
        # request without a session, and that can only be proven against a real app.
        # Still no torch, cv2 or SDK — those stay out of CI.
        run: pip install ruff pytest cryptography aiosqlite psutil httpx boto3 pydantic pyyaml fastapi segno

      # Lint covers only modules already cleaned up; widen it one module at a time.
      - name: Ruff (lint)
        run: ruff check tests/ src/palmgrade/domain/ src/palmgrade/integrations/erp/ src/palmgrade/integrations/outbox/ src/palmgrade/integrations/upload/ src/palmgrade/license/ src/palmgrade/plc/ src/palmgrade/workers/batch_upload_worker.py src/palmgrade/workers/master_data_worker.py src/palmgrade/workers/erp_outbox_worker.py src/palmgrade/workers/erp_link.py src/palmgrade/workers/visit_resend_worker.py src/palmgrade/services/erp_queue.py src/palmgrade/services/auth_service.py src/palmgrade/services/operator_admin.py src/palmgrade/integrations/notifications/line_client.py src/palmgrade/repositories/console_repository.py src/palmgrade/services/console_service.py src/palmgrade/routes/console.py src/palmgrade/console_main.py

      - name: Pytest (unit)
        run: pytest tests/unit/
