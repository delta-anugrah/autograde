name: CI

on:
  pull_request:
    branches: [staging, main]
  # `push` HANYA di `main`, bukan staging. Tiap perubahan sudah diuji sebagai
  # PR; menjalankannya lagi saat merge ke staging menguji commit yang sama
  # persis dan membayar dua kali — 10 dari 26 run CI terakhir adalah itu.
  #
  # `main` tetap dijaga karena itu yang menuju pabrik, dan merge ke sana bisa
  # membawa penyelesaian konflik yang belum pernah diuji sebagai satu kesatuan
  # (terjadi di #139).
  #
  # ⚠️ TIDAK ada `paths-ignore` di sini, walau terlihat seperti penghematan
  # gratis: `tests/unit/test_doc_links.py` membaca seluruh `docs/**/*.md`, dan
  # delapan dokumen lain punya test isinya sendiri. PR yang cuma menyunting
  # dokumen justru satu-satunya yang bisa memerahkan test itu.
  push:
    branches: [main]
  # Dipanggil `deploy.yml` (job `ci`) saat tag rilis: image baru dibangun sesudah
  # seluruh langkah di bawah hijau di commit tag yang SAMA (batch 4.1). Tanpa
  # input dan tanpa secret, jadi pemanggilnya tidak butuh `secrets: inherit`;
  # menambah `secrets.*` di sini berarti mengubah `deploy.yml` juga.
  workflow_call:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # Tanpa ini tiap run mengunduh ulang ~14 wheel, termasuk opencv
          # (~35 MB). Kuncinya hash `requirements-ci.txt`, jadi cache-nya
          # gugur sendiri begitu daftarnya berubah.
          cache: pip
          cache-dependency-path: requirements-ci.txt

      # No torch/opencv/SDK on purpose: unit tests are pure logic, so CI stays
      # fast and needs no GPU. The rest are light pure-python wheels.
      # Daftarnya hidup di `requirements-ci.txt` supaya bisa di-hash jadi kunci
      # cache. Alasan tiap paket ada di sana. Yang tidak berubah: **tidak ada
      # torch, tidak ada SDK di CI.**
      - name: Install tooling
        run: pip install -r requirements-ci.txt

      # Batch 4.4: seluruh kode. Ruff membaca berkas tanpa mengimpornya, jadi modul yang
      # butuh torch/cv2/SDK (yang tidak dipasang di sini) tetap bisa dilint. Daftar modul
      # yang dulu ada di baris ini membiarkan jalur panas (`main.py`, worker deteksi)
      # tidak pernah diperiksa. `main.py` kini ikut penuh, jadi langkah terpisah yang dulu
      # cuma memeriksa nama tak terdefinisi (F821) di sana tidak perlu lagi: F821 bagian
      # dari aturan `F`. Dijaga `tests/unit/test_requirements_ci_terkunci.py`.
      - name: Ruff (lint)
        run: ruff check src/ tests/ scripts/smoke_image.py

      # Batch 4.3: test konsol lain menyalin satu fungsi lalu menjalankannya, jadi
      # syntax error DI LUAR fungsi itu lolos semua test sementara browser menolak
      # seluruh skrip dan layar operator kosong. Ini memparse tiap `<script>` utuh.
      # Keluar 2 (gagal) kalau node tidak ada atau tidak ada blok yang ketemu.
      - name: Parse console.html scripts (node)
        run: python tests/cek_skrip_konsol.py src/palmgrade/static/console.html

      # `-rs` untuk alasan yang sama dengan e2e dan integration di bawah: test yang
      # melewati dirinya (node, docker, model tidak ada) harus terbaca alasannya,
      # bukan tenggelam di angka "N skipped".
      - name: Pytest (unit)
        run: pytest tests/unit/ -rs

      # The e2e suite guards the paths that move money and metal: the ERP sync, the
      # gate QR scan, truck reconciliation and the PLC coil trigger. It was written
      # but never wired into CI, so a regression in any of them reached `staging`
      # with every check green -- which is exactly what happened to the weigh-out
      # lane, red for a full day before anyone noticed (fixed in #96).
      #
      # It needs no GPU, no camera and no SDK: the tests that require a live ERP or
      # a docker image skip themselves. Measured on this suite, 129 pass and 12 skip
      # in about 40 seconds, so nothing here slows a PR down meaningfully.
      #
      # `-rs` prints why each test skipped. Without it a suite that silently stopped
      # running anything would still report success, which is the failure this whole
      # step exists to prevent.
      - name: Pytest (e2e)
        run: pytest tests/e2e/ -rs

      # Integrasi: beberapa komponen SUNGGUHAN dirangkai tanpa Docker/hardware —
      # konsol ↔ line lewat transport ASGI in-process, berkas di folder sementara,
      # dan render layar lewat node. Paket yang dibutuhkan sama dengan unit/e2e.
      # `-rs` untuk alasan yang sama dengan e2e: suite yang diam-diam berhenti
      # menjalankan apa pun tetap terbaca hijau tanpanya.
      - name: Pytest (integration)
        run: pytest tests/integration/ -rs

  # Tes browser: konsol asli (dari salinan kode, port acak, data demo) dikendalikan
  # Playwright di dua mesin browser. Firefox karena kiosk pabrik memakai Firefox,
  # Chromium karena demo dan laptop memakai Chrome; keduanya pernah berbeda
  # perilaku di konsol ini. Wajib lolos (ruleset repo), jadi `WAJIB_BROWSER=1`
  # membuat Playwright yang hilang jadi gagal, bukan dilewati diam-diam.
  browser:
    name: browser (${{ matrix.browser }})
    runs-on: ubuntu-latest
    # About 2 minutes locally for both engines; a hung browser must not hold the runner
    # for GitHub's 6-hour default.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-browser.txt

      - name: Install tooling
        run: pip install -r requirements-ci.txt -r requirements-browser.txt

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.browser }}-${{ hashFiles('requirements-browser.txt') }}

      - name: Install browser
        run: python -m playwright install --with-deps ${{ matrix.browser }}

      - name: Pytest (browser)
        env:
          WAJIB_BROWSER: "1"
        run: >-
          pytest tests/browser/ -rs --browser ${{ matrix.browser }}
          --tracing retain-on-failure --screenshot only-on-failure --output test-results

      - name: Keep traces of a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.browser }}
          path: test-results/
