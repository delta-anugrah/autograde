name: CI

on:
  pull_request:
    branches: [staging, main]
  # `push` HANYA di `main`, bukan staging. Tiap perubahan sudah diuji sebagai
  # PR; menjalankannya lagi saat merge ke staging menguji commit yang sama
  # persis dan membayar dua kali — 10 dari 26 run CI terakhir adalah itu.
  #
  # `main` tetap dijaga karena itu yang menuju pabrik, dan merge ke sana bisa
  # membawa penyelesaian konflik yang belum pernah diuji sebagai satu kesatuan
  # (terjadi di #139).
  #
  # ⚠️ TIDAK ada `paths-ignore` di sini, walau terlihat seperti penghematan
  # gratis: `tests/unit/test_doc_links.py` membaca seluruh `docs/**/*.md`, dan
  # delapan dokumen lain punya test isinya sendiri. PR yang cuma menyunting
  # dokumen justru satu-satunya yang bisa memerahkan test itu.
  push:
    branches: [main]
  # Dipanggil `deploy.yml` (job `ci`) saat tag rilis: image baru dibangun sesudah
  # seluruh langkah di bawah hijau di commit tag yang SAMA (batch 4.1). Tanpa
  # input dan tanpa secret, jadi pemanggilnya tidak butuh `secrets: inherit`;
  # menambah `secrets.*` di sini berarti mengubah `deploy.yml` juga.
  workflow_call:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # Tanpa ini tiap run mengunduh ulang ~14 wheel, termasuk opencv
          # (~35 MB). Kuncinya hash `requirements-ci.txt`, jadi cache-nya
          # gugur sendiri begitu daftarnya berubah.
          cache: pip
          cache-dependency-path: requirements-ci.txt

      # No torch/opencv/SDK on purpose: unit tests are pure logic, so CI stays
      # fast and needs no GPU. The rest are light pure-python wheels.
      # Daftarnya hidup di `requirements-ci.txt` supaya bisa di-hash jadi kunci
      # cache. Alasan tiap paket ada di sana. Yang tidak berubah: **tidak ada
      # torch, tidak ada SDK di CI.**
      - name: Install tooling
        run: pip install -r requirements-ci.txt

      # Lint covers only modules already cleaned up; widen it one module at a time.
      - name: Ruff (lint)
        run: ruff check tests/ src/palmgrade/domain/ src/palmgrade/integrations/erp/ src/palmgrade/integrations/outbox/ src/palmgrade/integrations/upload/ src/palmgrade/license/ src/palmgrade/plc/ src/palmgrade/workers/batch_upload_worker.py src/palmgrade/workers/pengawas_worker.py src/palmgrade/integrations/scheduler/ src/palmgrade/workers/master_data_worker.py src/palmgrade/workers/erp_outbox_worker.py src/palmgrade/workers/erp_link.py src/palmgrade/workers/visit_resend_worker.py src/palmgrade/services/erp_queue.py src/palmgrade/services/auth_service.py src/palmgrade/services/operator_admin.py src/palmgrade/integrations/notifications/line_client.py src/palmgrade/repositories/console_repository.py src/palmgrade/services/capture_writer.py src/palmgrade/services/console_service.py src/palmgrade/services/layar_line_support.py src/palmgrade/routes/console.py src/palmgrade/routes/console_deps.py src/palmgrade/routes/console_ingest.py src/palmgrade/console_main.py src/palmgrade/services/bahaya_service.py src/palmgrade/services/hapus_data_line.py src/palmgrade/routes/internal_bahaya.py src/palmgrade/services/riwayat_service.py src/palmgrade/services/impor_grading_service.py src/palmgrade/repositories/riwayat_repository.py src/palmgrade/services/status_sinkron.py src/palmgrade/workers/cek_sinkron_worker.py src/palmgrade/workers/line_status_worker.py src/palmgrade/workers/visit_manifest_worker.py src/palmgrade/routes/penjaga_rahasia.py src/palmgrade/routes/captures.py src/palmgrade/services/pindah_db_line.py src/palmgrade/repositories/console_skema.py src/palmgrade/repositories/console_akun_repository.py src/palmgrade/services/penutup_line.py src/palmgrade/services/langkah_tutup_line.py src/palmgrade/integrations/storage/ src/palmgrade/workers/outbox_retry_worker.py src/palmgrade/services/antrean_line.py src/palmgrade/routes/internal_outbox.py src/palmgrade/services/pantau_antrean_line.py src/palmgrade/routes/console_antrean_line.py src/palmgrade/services/penjaga_ai.py src/palmgrade/routes/health_ringan.py src/palmgrade/core/logging.py src/palmgrade/core/log_akses.py src/palmgrade/core/log_sink.py src/palmgrade/workers/frame_capture_worker.py src/palmgrade/integrations/camera/base.py src/palmgrade/repositories/log_repository.py src/palmgrade/repositories/log_line_repository.py src/palmgrade/services/antrean_log_line.py src/palmgrade/repositories/log_serap_line.py src/palmgrade/routes/internal_log.py src/palmgrade/workers/tarik_log_line_worker.py src/palmgrade/repositories/lapor_discord_repository.py src/palmgrade/integrations/notifications/discord_client.py src/palmgrade/workers/lapor_discord_worker.py src/palmgrade/services/lapor_discord.py src/palmgrade/routes/console_lapor_discord.py src/palmgrade/services/pemantau_disk.py src/palmgrade/controllers/internal_controller.py src/palmgrade/core/config.py src/palmgrade/integrations/camera/hikrobot_camera.py src/palmgrade/routes/internal.py src/palmgrade/schemas/common_schema.py src/palmgrade/schemas/internal_schema.py src/palmgrade/services/health_service.py src/palmgrade/services/video_recorder.py src/palmgrade/workers/runtime_state.py src/palmgrade/schemas/console_schema.py

      # main.py stays out of the list above (it imports torch), but batch 3 edits its
      # import block from three branches: an import lost in a merge crashes every line
      # at boot while every test stays green. Undefined names at least.
      - name: Ruff (main.py undefined names)
        run: ruff check --select F821 src/palmgrade/main.py

      # Batch 4.3: test konsol lain menyalin satu fungsi lalu menjalankannya, jadi
      # syntax error DI LUAR fungsi itu lolos semua test sementara browser menolak
      # seluruh skrip dan layar operator kosong. Ini memparse tiap `<script>` utuh.
      # Keluar 2 (gagal) kalau node tidak ada atau tidak ada blok yang ketemu.
      - name: Parse console.html scripts (node)
        run: python tests/cek_skrip_konsol.py src/palmgrade/static/console.html

      # `-rs` untuk alasan yang sama dengan e2e dan integration di bawah: test yang
      # melewati dirinya (node, docker, model tidak ada) harus terbaca alasannya,
      # bukan tenggelam di angka "N skipped".
      - name: Pytest (unit)
        run: pytest tests/unit/ -rs

      # The e2e suite guards the paths that move money and metal: the ERP sync, the
      # gate QR scan, truck reconciliation and the PLC coil trigger. It was written
      # but never wired into CI, so a regression in any of them reached `staging`
      # with every check green -- which is exactly what happened to the weigh-out
      # lane, red for a full day before anyone noticed (fixed in #96).
      #
      # It needs no GPU, no camera and no SDK: the tests that require a live ERP or
      # a docker image skip themselves. Measured on this suite, 129 pass and 12 skip
      # in about 40 seconds, so nothing here slows a PR down meaningfully.
      #
      # `-rs` prints why each test skipped. Without it a suite that silently stopped
      # running anything would still report success, which is the failure this whole
      # step exists to prevent.
      - name: Pytest (e2e)
        run: pytest tests/e2e/ -rs

      # Integrasi: beberapa komponen SUNGGUHAN dirangkai tanpa Docker/hardware —
      # konsol ↔ line lewat transport ASGI in-process, berkas di folder sementara,
      # dan render layar lewat node. Paket yang dibutuhkan sama dengan unit/e2e.
      # `-rs` untuk alasan yang sama dengan e2e: suite yang diam-diam berhenti
      # menjalankan apa pun tetap terbaca hijau tanpanya.
      - name: Pytest (integration)
        run: pytest tests/integration/ -rs
