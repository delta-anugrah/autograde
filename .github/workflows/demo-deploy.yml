name: Deploy AutoGrade Demo

# Upgrades demo-autograde.smagri.id to vX.Y.Z-cpu. Called by demo-image.yml after `promote`;
# run by hand (Actions > Deploy AutoGrade Demo > Run workflow) to roll back to an older version.
# The key can only run `demo-autograde upgrade|status` on the droplet
# (deploy/demo/demo-autograde-ci.sh); the droplet also runs production AutoERP.
# Secrets live in the `demo` environment (DEMO_SSH_HOST, DEMO_SSH_USER, DEMO_SSH_KEY,
# DEMO_SSH_KNOWN_HOSTS); its rule lets only `v*` tags and `main` deploy.

on:
  workflow_call:
    inputs:
      version:
        description: "Release tag the demo runs next, e.g. v1.26.2"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Version to run on the demo, e.g. v1.26.2"
        required: true

# One deploy at a time, and a queued one is never cancelled: two tags close together both land,
# in order. The droplet side refuses a second concurrent run too (exit 75).
concurrency:
  group: demo-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: demo
    timeout-minutes: 15
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check version
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $VERSION"
            exit 1
          fi

      - name: Upgrade the demo
        shell: bash
        env:
          HOST: ${{ secrets.DEMO_SSH_HOST }}
          USER_: ${{ secrets.DEMO_SSH_USER }}
          KEY: ${{ secrets.DEMO_SSH_KEY }}
          KNOWN: ${{ secrets.DEMO_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f key known_hosts' EXIT
          printf '%s\n' "$KEY" >key
          printf '%s\n' "$KNOWN" >known_hosts
          # Host key pinned from the environment: a changed key stops here, never trusted blindly.
          ssh -i key -o UserKnownHostsFile=known_hosts -o BatchMode=yes -o ConnectTimeout=20 \
            "$USER_@$HOST" "upgrade $VERSION"
