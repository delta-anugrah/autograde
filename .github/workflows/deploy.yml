name: Build and Push AutoGrade Release Image

# Build-only, unlike the api and frontend workflows: vision runs on factory PCs
# that this workflow cannot reach (no public address, no inbound SSH). The PC
# pulls the image itself, so all this job has to do is publish it.
#
# The package inherits the repository's visibility, and this repository is
# private on purpose: the image bakes in the proprietary Hikrobot MVS SDK.
# Never make it public.

on:
  push:
    tags:
      - "v*.*.*"

env:
  REGISTRY: ghcr.io
  # One name, no legacy (decision 2026-09-18: everything moves to AutoGrade, the
  # Lampung PC included, and the old `palmgrade-vision` name is not carried over).
  #
  # ⚠️ BEFORE the first tag, `PALMGRADE_VISION_IMAGE` in
  # `/opt/palmgrade/vision/.env` on the Lampung PC must already point at this
  # name. That machine has no inbound SSH — it is edited by hand over AnyDesk —
  # and its updater compares the configured name against the `:latest` marker
  # under that same name. Tag first, edit later, and `palmgrade pull vision`
  # answers "already up to date" forever: no error anywhere, the factory simply
  # stops receiving updates, and it only surfaces when someone asks why the
  # version never moves.
  #
  # Pinned, never `${{ github.repository }}`: a repo rename would move the image
  # and cut the factory off in exactly the same silent way.
  IMAGE_NAME: delta-anugrah/autograde

jobs:
  # Batch 4.1: no image is built before the whole CI suite passed on THIS commit.
  # `ci.yml` is called, not waited for. It also runs on the push to `main`, but
  # finding "the run for this tag" means guessing: the tag can arrive before that
  # run is registered, or sit on a commit whose run was cancelled or re-run, and a
  # job that polls burns the same runner minutes as running the suite itself.
  # `./` runs ci.yml from this very commit, and the called workflow sees this
  # run's github context (sha, ref), so its checkout is exactly the tagged commit.
  ci:
    uses: ./.github/workflows/ci.yml
    # A called workflow can keep or narrow these, never widen them.
    permissions:
      contents: read

  # Batch 4.2: build under a temporary `candidate-vX.Y.Z` tag only. The release tag and
  # `latest` are written by `promote`, after `smoke` passed on that exact digest. A factory
  # PC reads only `latest` (and the version label), so it never sees a candidate.
  build-and-push:
    needs: ci
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag and main ancestry
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME}"

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $VERSION"
            exit 1
          fi

          git fetch origin main

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tag must reference a commit contained in main"
            exit 1
          fi

      # The CUDA torch wheels unpack to several GB. A hosted runner has room for
      # that only after the preinstalled toolchains it will never use are gone;
      # without this the build dies late with "no space left on device".
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reject existing immutable release tag
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${GITHUB_REF_NAME}"

          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo "Release image already exists and must not be overwritten: $IMAGE"
            exit 1
          fi

      # Cache ke REGISTRY, bukan ke cache GitHub Actions.
      #
      # Alasan lama masih berlaku: layer CUDA + torch sendirian lebih besar
      # dari batas 10 GB cache GHA, jadi `type=gha` akan mengusir dirinya
      # sendiri tiap run dan tidak membeli apa pun. Ada test yang menjaga
      # `type=gha` tidak kembali (`tests/unit/test_ci_hemat.py`).
      #
      # GHCR tidak punya batas itu — layernya duduk di registry yang sama
      # dengan image-nya. Yang di-cache justru yang paling mahal dan paling
      # jarang berubah: torch, CUDA, SDK. Build biasanya ~10 menit; dengan
      # layer itu dipakai ulang, yang tersisa cuma menyalin kode.
      #
      # `mode=max` menyimpan layer perantara juga, bukan cuma yang terakhir —
      # tanpa itu build multi-tahap seperti ini hampir tidak dapat manfaat.
      # Tag `buildcache` terpisah dari tag rilis, jadi tidak pernah tertukar
      # dengan image yang ditarik pabrik.
      - name: Build and push candidate image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
          build-args: |
            TORCH_VARIANT=cu126
            WITH_SDK=true
            APP_VERSION=${{ github.ref_name }}
          # Candidate only. The label already carries the final version: `promote` copies
          # this digest unchanged, and the factory launcher reads the version from it.
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:candidate-${{ github.ref_name }}
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  smoke:
    needs: build-and-push
    uses: ./.github/workflows/image-smoke.yml
    with:
      image: ghcr.io/delta-anugrah/autograde@${{ needs.build-and-push.outputs.digest }}
      version: ${{ github.ref_name }}
      label: ${{ github.ref_name }}
    permissions:
      contents: read
      packages: read

  # Copies the smoked digest to the release tag and `latest` in the registry: no rebuild,
  # the same layers that passed `smoke`. The digest of the result is printed for the log.
  promote:
    needs: [build-and-push, smoke]
    runs-on: ubuntu-latest
    # Two tags pushed close together: smoke time varies with the pull, so without a queue
    # the older release could write `latest` last and move the factory backwards.
    concurrency:
      group: promote-release-latest
      cancel-in-progress: false

    permissions:
      contents: read
      packages: write

    env:
      SOURCE: ghcr.io/delta-anugrah/autograde@${{ needs.build-and-push.outputs.digest }}

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Checked again here: the build started minutes ago, and a release tag is immutable.
      # The one exception is a re-run of this job after it wrote the release tag but failed
      # on `latest`: the tag then already points at this very digest, and writing both
      # again changes nothing but `latest`.
      - name: Reject existing immutable release tag
        shell: bash
        env:
          DIGEST: ${{ needs.build-and-push.outputs.digest }}
        run: |
          set -euo pipefail
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${GITHUB_REF_NAME}"
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            EXISTING=$(docker buildx imagetools inspect "$IMAGE" --format '{{.Manifest.Digest}}')
            if [ "$EXISTING" = "$DIGEST" ]; then
              echo "Release tag already points at this candidate ($DIGEST): re-run, writing latest again"
              exit 0
            fi
            echo "Release image already exists and must not be overwritten: $IMAGE"
            exit 1
          fi

      # `latest` is the marker the factory updater reads to find out whether a newer
      # version exists. It moves; the vX.Y.Z tag never does.
      - name: Promote candidate to the release tag and latest
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${GITHUB_REF_NAME}" \
            --tag "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" \
            "$SOURCE"
          echo "candidate digest: $SOURCE"
          docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${GITHUB_REF_NAME}"

  # The CPU demo image (`vX.Y.Z-cpu`, demo-autograde.smagri.id) waits for the same
  # CI run instead of starting on its own at tag time, so a version whose tests are
  # red is published under neither name. It runs beside the factory build, not
  # after it: a failed demo build never holds back the image the factory pulls. The two
  # smoke tests are separate too, so `vX.Y.Z-cpu` can exist while the factory `vX.Y.Z`
  # failed its smoke; the fix is a new tag either way, and `demo-autograde upgrade` to such
  # a version is simply not done.
  demo:
    needs: ci
    uses: ./.github/workflows/demo-image.yml
    with:
      version: ${{ github.ref_name }}
    permissions:
      contents: read
      packages: write
