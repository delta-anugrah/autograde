name: Build and Push Vision Release Image

# Build-only, unlike the api and frontend workflows: vision runs on factory PCs
# that this workflow cannot reach (no public address, no inbound SSH). The PC
# pulls the image itself, so all this job has to do is publish it.
#
# The package inherits the repository's visibility, and this repository is
# private on purpose: the image bakes in the proprietary Hikrobot MVS SDK.
# Never make it public.

on:
  push:
    tags:
      - "v*.*.*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag and main ancestry
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME}"

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $VERSION"
            exit 1
          fi

          git fetch origin main

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tag must reference a commit contained in main"
            exit 1
          fi

      # The CUDA torch wheels unpack to several GB. A hosted runner has room for
      # that only after the preinstalled toolchains it will never use are gone;
      # without this the build dies late with "no space left on device".
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reject existing immutable release tag
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${GITHUB_REF_NAME}"

          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo "Release image already exists and must not be overwritten: $IMAGE"
            exit 1
          fi

      # No build cache: the CUDA layers alone are larger than the 10 GB GitHub
      # Actions cache, so caching them would evict itself every run and buy
      # nothing. Vision ships rarely; a cold build is the cheaper trade.
      - name: Build and push versioned image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            TORCH_VARIANT=cu126
            WITH_SDK=true
            APP_VERSION=${{ github.ref_name }}
          # `latest` is the marker the factory updater reads to find out whether
          # a newer version exists. It moves; the vX.Y.Z tag never does.
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
