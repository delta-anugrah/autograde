name: Build AutoGrade Demo Image (CPU)

# Console-only image for the internet demo (demo-autograde.smagri.id): CPU torch, no camera SDK.
# Publishes vX.Y.Z-cpu only; factory PCs update from `latest`, which this workflow never writes.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Released version to build, e.g. v1.19.0"
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: delta-anugrah/autograde
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Validate version
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $VERSION"
            exit 1
          fi

      - name: Checkout released code
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.VERSION }}
          fetch-depth: 0

      - name: Require a release that is on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "$VERSION is not on main"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reject existing demo image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="$REGISTRY/$IMAGE_NAME:$VERSION-cpu"
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo "Demo image already exists and must not be overwritten: $IMAGE"
            exit 1
          fi

      # Own cache ref: sharing :buildcache would evict the CUDA layers the factory release reuses.
      - name: Build and push demo image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-cpu
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-cpu,mode=max
          build-args: |
            TORCH_VARIANT=cpu
            WITH_SDK=false
            APP_VERSION=${{ env.VERSION }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}-cpu
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}-cpu
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
