name: Build AutoGrade Demo Image (CPU)

# Console-only image for the internet demo (demo-autograde.smagri.id): CPU torch, no camera SDK.
# Publishes candidate-vX.Y.Z-cpu, then vX.Y.Z-cpu once it passed image-smoke.yml; factory PCs update
# from `latest`, which this workflow never writes.

on:
  # Called by deploy.yml once its `ci` job passed on the tag commit (batch 4.1).
  # No `push: tags` trigger of its own any more: with both, every tag would build
  # twice, before CI and after it.
  workflow_call:
    inputs:
      version:
        description: "Release tag being built, e.g. v1.20.0"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Released version to build, e.g. v1.19.0"
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: delta-anugrah/autograde
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  # Batch 4.2: same order as the factory image in deploy.yml. Build under
  # `candidate-vX.Y.Z-cpu`, smoke that digest (demo kit included), then copy it to
  # `vX.Y.Z-cpu`. `demo-autograde upgrade` only ever pulls `vX.Y.Z-cpu`.
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Validate version
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $VERSION"
            exit 1
          fi

      - name: Checkout released code
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.VERSION }}
          fetch-depth: 0

      - name: Require a release that is on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "$VERSION is not on main"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A manual run may only rebuild a version that was really released: from this
      # release on, the factory image `vX.Y.Z` exists only for a tag that passed
      # deploy.yml, CI included (older factory images, such as v1.19.0, were built
      # before that gate existed). Skipped when deploy.yml calls this workflow (the
      # event is then the tag push), because that tag's factory image is still being
      # built beside it.
      - name: Require a published factory release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          RELEASE="$REGISTRY/$IMAGE_NAME:$VERSION"
          if ! docker buildx imagetools inspect "$RELEASE" >/dev/null 2>&1; then
            echo "$VERSION has no factory release image; release it through deploy.yml first"
            exit 1
          fi

      - name: Reject existing demo image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="$REGISTRY/$IMAGE_NAME:$VERSION-cpu"
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo "Demo image already exists and must not be overwritten: $IMAGE"
            exit 1
          fi

      # Own cache ref: sharing :buildcache would evict the CUDA layers the factory release reuses.
      - name: Build and push candidate demo image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-cpu
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-cpu,mode=max
          build-args: |
            TORCH_VARIANT=cpu
            WITH_SDK=false
            APP_VERSION=${{ env.VERSION }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:candidate-${{ env.VERSION }}-cpu
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}-cpu
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  smoke:
    needs: build-and-push
    uses: ./.github/workflows/image-smoke.yml
    with:
      image: ghcr.io/delta-anugrah/autograde@${{ needs.build-and-push.outputs.digest }}
      version: ${{ inputs.version || github.ref_name }}
      label: ${{ inputs.version || github.ref_name }}-cpu
      demo: true
    permissions:
      contents: read
      packages: read

  promote:
    needs: [build-and-push, smoke]
    runs-on: ubuntu-latest
    concurrency:
      group: promote-demo-${{ inputs.version || github.ref_name }}
      cancel-in-progress: false

    permissions:
      contents: read
      packages: write

    env:
      SOURCE: ghcr.io/delta-anugrah/autograde@${{ needs.build-and-push.outputs.digest }}

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reject existing demo image
        shell: bash
        env:
          DIGEST: ${{ needs.build-and-push.outputs.digest }}
        run: |
          set -euo pipefail
          IMAGE="$REGISTRY/$IMAGE_NAME:$VERSION-cpu"
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            EXISTING=$(docker buildx imagetools inspect "$IMAGE" --format '{{.Manifest.Digest}}')
            if [ "$EXISTING" = "$DIGEST" ]; then
              echo "Demo tag already points at this candidate ($DIGEST): re-run"
              exit 0
            fi
            echo "Demo image already exists and must not be overwritten: $IMAGE"
            exit 1
          fi

      # Never `latest`: factory PCs update from it.
      - name: Promote candidate to the demo tag
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "$REGISTRY/$IMAGE_NAME:$VERSION-cpu" "$SOURCE"
          docker buildx imagetools inspect "$REGISTRY/$IMAGE_NAME:$VERSION-cpu"

  # 2026-10-09: the demo follows every release by itself (deploy/demo/demo-autograde-ci.sh on the
  # droplet). Only after `promote`, so `vX.Y.Z-cpu` exists. A failed upgrade rolls the demo back
  # to the version it ran; it never touches the factory image.
  deploy-demo:
    needs: promote
    uses: ./.github/workflows/demo-deploy.yml
    with:
      version: ${{ inputs.version || github.ref_name }}
    permissions:
      contents: read
