<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" font-family="'Noto Sans','Helvetica Neue',Helvetica,Arial,sans-serif" role="img" aria-label="Diagram keadaan piston manual: Tertutup, Menunggu konfirmasi, Terbuka, dan jalur kembali saat E-stop ditekan">
  <defs>
    <marker id="piston-panah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#134e5e"/>
    </marker>
    <marker id="piston-panah-merah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b3462f"/>
    </marker>
  </defs>

  <!-- Tertutup -->
  <rect x="16" y="66" width="168" height="78" rx="10" fill="#eef5f6" stroke="#1f7a8c" stroke-width="1.5"/>
  <text x="100" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#134e5e">Tertutup</text>
  <text x="100" y="118" text-anchor="middle" font-size="10.5" fill="#5a6670">coil = 0</text>
  <text x="100" y="134" text-anchor="middle" font-size="10.5" fill="#5a6670">sortir kamera jalan</text>

  <!-- Menunggu -->
  <rect x="266" y="66" width="168" height="78" rx="10" fill="#ffffff" stroke="#134e5e" stroke-width="1.5"/>
  <text x="350" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#134e5e">Menunggu</text>
  <text x="350" y="118" text-anchor="middle" font-size="10.5" fill="#5a6670">coil = 1, DI masih 0</text>
  <text x="350" y="134" text-anchor="middle" font-size="10.5" fill="#5a6670">tombol tidak bisa diklik</text>

  <!-- Terbuka -->
  <rect x="516" y="66" width="168" height="78" rx="10" fill="#eef5f6" stroke="#1f7a8c" stroke-width="1.5"/>
  <text x="600" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#134e5e">Terbuka</text>
  <text x="600" y="118" text-anchor="middle" font-size="10.5" fill="#5a6670">coil = 1, DI = 1</text>
  <text x="600" y="134" text-anchor="middle" font-size="10.5" fill="#5a6670">pulse OK/NG diabaikan</text>

  <!-- Tertutup -> Menunggu -->
  <line x1="190" y1="94" x2="258" y2="94" stroke="#134e5e" stroke-width="2" marker-end="url(#piston-panah)"/>
  <text x="224" y="82" text-anchor="middle" font-size="10.5" font-weight="700" fill="#134e5e">klik Buka</text>
  <text x="224" y="60" text-anchor="middle" font-size="10" fill="#5a6670">coil 0 → 1</text>

  <!-- Menunggu -> Terbuka -->
  <line x1="440" y1="94" x2="508" y2="94" stroke="#134e5e" stroke-width="2" marker-end="url(#piston-panah)"/>
  <text x="474" y="82" text-anchor="middle" font-size="10.5" font-weight="700" fill="#134e5e">DI = 1</text>
  <text x="474" y="60" text-anchor="middle" font-size="10" fill="#5a6670">ladder mengaku</text>

  <!-- Terbuka -> Tertutup (klik Tutup), jalur bawah -->
  <path d="M600,150 L600,186 L64,186 L64,150" fill="none" stroke="#134e5e" stroke-width="2" marker-end="url(#piston-panah)"/>
  <rect x="246" y="176" width="172" height="18" fill="#ffffff"/>
  <text x="332" y="190" text-anchor="middle" font-size="10.5" font-weight="700" fill="#134e5e">klik Tutup — coil 1 → 0</text>

  <!-- Menunggu -> Tertutup (ditolak), jalur bawah kedua -->
  <path d="M350,150 L350,218 L136,218 L136,150" fill="none" stroke="#5a6670" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#piston-panah)"/>
  <text x="356" y="236" text-anchor="middle" font-size="10.5" fill="#5a6670">DI tetap 0 lebih dari ±2 detik — AutoGrade menurunkan coil sendiri</text>

  <!-- E-stop -->
  <path d="M684,105 L696,105 L696,272 L100,272 L100,232" fill="none" stroke="#b3462f" stroke-width="2" marker-end="url(#piston-panah-merah)"/>
  <text x="400" y="290" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b3462f">E-stop ditekan — piston tutup seketika</text>
  <text x="400" y="308" text-anchor="middle" font-size="11" fill="#b3462f">Setelah E-stop dilepas piston TETAP tertutup, sampai ada perubahan 0 → 1 baru dari operator.</text>
  <text x="400" y="326" text-anchor="middle" font-size="10.5" fill="#5a6670">Aturan terpenting: tanpa ini, melepas E-stop membuat piston bergerak sendiri.</text>

  <text x="16" y="30" font-size="10" font-weight="700" letter-spacing="1.3" fill="#b3462f">SIAP DI APLIKASI — ALOKASI COIL/DI MENUNGGU PANEL</text>
</svg>
