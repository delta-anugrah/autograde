<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="'Noto Sans','Helvetica Neue',Helvetica,Arial,sans-serif" role="img" aria-label="PC pabrik menjalankan tiga proses line yang bicara Modbus-TCP ke coupler ODOT CN-8031, lalu ke PLC Mitsubishi lewat kabel">
  <defs>
    <marker id="topologi-panah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#134e5e"/>
    </marker>
    <marker id="topologi-panah-balik" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a6670"/>
    </marker>
  </defs>

  <!-- PC pabrik -->
  <rect x="8" y="30" width="208" height="182" rx="10" fill="#eef5f6" stroke="#1f7a8c" stroke-width="1.5"/>
  <text x="26" y="56" font-size="10" font-weight="700" letter-spacing="1.3" fill="#1f7a8c">PC PABRIK</text>
  <text x="26" y="80" font-size="16" font-weight="700" fill="#134e5e">AutoGrade</text>
  <g font-size="11.5" fill="#1b1f1d">
    <text x="26" y="108">Proses line 1 — coil 0, 1, 2</text>
    <text x="26" y="130">Proses line 2 — coil 3, 4, 5</text>
    <text x="26" y="152">Proses line 3 — coil 6, 7, 8</text>
  </g>
  <text x="26" y="180" font-size="10.5" fill="#5a6670">Tiga koneksi Modbus terpisah,</text>
  <text x="26" y="196" font-size="10.5" fill="#5a6670">satu per proses.</text>

  <!-- Coupler -->
  <rect x="266" y="30" width="168" height="182" rx="10" fill="#ffffff" stroke="#134e5e" stroke-width="1.5"/>
  <text x="284" y="56" font-size="10" font-weight="700" letter-spacing="1.3" fill="#134e5e">REMOTE IO</text>
  <text x="284" y="80" font-size="16" font-weight="700" fill="#134e5e">ODOT CN-8031</text>
  <g font-size="11.5" fill="#1b1f1d">
    <text x="284" y="108">CT-222F — output</text>
    <text x="284" y="130">CT-122F — input</text>
    <text x="284" y="152">CT-5801 — catu daya</text>
  </g>
  <text x="284" y="180" font-size="10.5" fill="#5a6670">Maksimum 5 client</text>
  <text x="284" y="196" font-size="10.5" fill="#5a6670">Modbus bersamaan.</text>

  <!-- PLC -->
  <rect x="484" y="30" width="208" height="182" rx="10" fill="#eef5f6" stroke="#1f7a8c" stroke-width="1.5"/>
  <text x="502" y="56" font-size="10" font-weight="700" letter-spacing="1.3" fill="#1f7a8c">PANEL</text>
  <text x="502" y="80" font-size="16" font-weight="700" fill="#134e5e">PLC Mitsubishi</text>
  <g font-size="11.5" fill="#1b1f1d">
    <text x="502" y="108">AJ65SBTB1-16D1 — input</text>
    <text x="502" y="130">X0300 – X030F</text>
    <text x="502" y="152">AJ65SBTB1-16T1 — output</text>
    <text x="502" y="174">Y0310 – Y031F</text>
  </g>
  <text x="502" y="200" font-size="10.5" fill="#5a6670">Ladder dan pengaman.</text>

  <!-- Link kiri: Modbus-TCP -->
  <line x1="222" y1="96" x2="258" y2="96" stroke="#134e5e" stroke-width="2" marker-end="url(#topologi-panah)"/>
  <text x="240" y="84" text-anchor="middle" font-size="10" font-weight="700" fill="#134e5e">coil</text>
  <line x1="258" y1="140" x2="222" y2="140" stroke="#5a6670" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#topologi-panah-balik)"/>
  <text x="240" y="158" text-anchor="middle" font-size="10" fill="#5a6670">DI</text>
  <text x="240" y="234" text-anchor="middle" font-size="10.5" font-weight="700" fill="#134e5e">Modbus-TCP</text>
  <text x="240" y="250" text-anchor="middle" font-size="10" fill="#5a6670">port 502</text>

  <!-- Link kanan: kabel -->
  <line x1="440" y1="96" x2="476" y2="96" stroke="#134e5e" stroke-width="2" marker-end="url(#topologi-panah)"/>
  <line x1="476" y1="140" x2="440" y2="140" stroke="#5a6670" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#topologi-panah-balik)"/>
  <text x="458" y="234" text-anchor="middle" font-size="10.5" font-weight="700" fill="#134e5e">kabel</text>
  <text x="458" y="250" text-anchor="middle" font-size="10" fill="#5a6670">sink / source</text>

  <text x="350" y="284" text-anchor="middle" font-size="11" fill="#5a6670">AutoGrade hanya menaikkan bit. Yang menggerakkan aktuator selalu ladder PLC.</text>
</svg>
