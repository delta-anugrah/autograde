<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 270" font-family="'Noto Sans','Helvetica Neue',Helvetica,Arial,sans-serif" role="img" aria-label="AutoGrade di PC pabrik mengirim rekap per truk ke AutoERP di cloud">
  <defs>
    <marker id="arsitektur-panah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#134e5e"/>
    </marker>
  </defs>

  <!-- Mill PC -->
  <rect x="8" y="16" width="276" height="200" rx="10" fill="#eef5f6" stroke="#1f7a8c" stroke-width="1.5"/>
  <text x="28" y="44" font-size="10" font-weight="700" letter-spacing="1.4" fill="#1f7a8c">PC PABRIK · DAPAT OFFLINE</text>
  <text x="28" y="76" font-size="22" font-weight="700" fill="#134e5e">AutoGrade</text>
  <text x="28" y="95" font-size="11" fill="#5a6670">repositori ini</text>
  <g font-size="12" fill="#1b1f1d">
    <text x="28" y="128">• 3 kamera + model AI (YOLO)</text>
    <text x="28" y="150">• Layar operator (konsol)</text>
    <text x="28" y="172">• PLC dan timbangan</text>
    <text x="28" y="194">• Python · FastAPI · SQLite</text>
  </g>

  <!-- Cloud -->
  <rect x="396" y="16" width="276" height="200" rx="10" fill="#ffffff" stroke="#134e5e" stroke-width="1.5"/>
  <text x="416" y="44" font-size="10" font-weight="700" letter-spacing="1.4" fill="#134e5e">SERVER CLOUD</text>
  <text x="416" y="76" font-size="22" font-weight="700" fill="#134e5e">AutoERP</text>
  <text x="416" y="95" font-size="11" fill="#5a6670">fork ERPNext</text>
  <g font-size="12" fill="#1b1f1d">
    <text x="416" y="128">• Harga, potongan, pembayaran</text>
    <text x="416" y="150">• Purchase Receipt dan stok</text>
    <text x="416" y="172">• Layar backoffice</text>
    <text x="416" y="194">• Frappe · MariaDB</text>
  </g>

  <!-- One-way link -->
  <line x1="292" y1="116" x2="386" y2="116" stroke="#134e5e" stroke-width="2" marker-end="url(#arsitektur-panah)"/>
  <text x="340" y="104" text-anchor="middle" font-size="11" font-weight="700" fill="#134e5e">rekap per truk</text>
  <text x="340" y="136" text-anchor="middle" font-size="10" fill="#5a6670">HTTPS · satu arah</text>

  <text x="146" y="246" text-anchor="middle" font-size="11" fill="#5a6670">Data per janjang dan foto tetap di pabrik</text>
  <text x="534" y="246" text-anchor="middle" font-size="11" fill="#5a6670">Hanya menerima rekap per kunjungan truk</text>
</svg>
