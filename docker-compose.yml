# ⚠️ Setelan sumber kamera per line datang dari `media.env`, dan berkas itu
# HARUS diberikan sebagai `--env-file`, bukan `env_file:` di service.
#
#   docker compose --env-file .env --env-file media.env ...
#
# Alasannya satu dan tidak bisa ditawar: Compose menyelesaikan `${LINE_1_...}`
# di bawah HANYA dari environment shell dan berkas `--env-file`. `env_file:`
# menyuntik environment CONTAINER, dan itu terjadi SESUDAH interpolasi — jadi
# `env_file: media.env` membuat `${LINE_1_CAMERA_TYPE:-hikrobot}` selalu jatuh
# ke `hikrobot` betapapun benar isi berkasnya. Terbukti di sini (Compose
# v5.5.1): media.env berisi `LINE_1_CAMERA_TYPE=opencv`, `docker compose config`
# tetap menjawab `CAMERA_TYPE: hikrobot`. Ini BUKAN beda versi Compose —
# urutannya sama di v2.x.
#
# `LINE_*_` itu leak yang menyesatkan: nama-nama itu tetap muncul di environment
# container walau mekanismenya rusak (mereka ikut dari `env_file`), jadi yang
# membuktikan benar-tidaknya cuma `CAMERA_TYPE` / `MEDIA_FILE` /
# `CAMERA_VIDEO_LOOP` — variabel yang sungguh dibaca `core/config.py`.
#
# `Makefile` sudah merutekan semuanya lewat `$(COMPOSE)`, yang membawa kedua
# flag dan membuat `media.env` kalau belum ada. Pemanggil di luar Makefile
# (skrip launcher PC pabrik) harus membawa kedua flag itu sendiri.

services:

  ripe-line-1:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TORCH_VARIANT: cu126
    image: palmgrade-vision:latest
    container_name: ripe_line_1
    restart: unless-stopped
    network_mode: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Healthcheck HTTP /health — restart policy hanya nolong kalau proses EXIT;
    # ini menandai container UNHEALTHY kalau proses masih hidup tapi HANG (mis.
    # threadpool starvation). Pakai python stdlib karena image slim tak punya curl.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,os;urllib.request.urlopen('http://localhost:'+os.environ['APP_PORT']+'/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    # Batasi ukuran log per container supaya disk tidak penuh (log FPS 24/7).
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_PORT=8001
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3050}
      - ENABLE_WEBHOOK=${ENABLE_WEBHOOK:-true}
      - BACKEND_URL=${BACKEND_URL:-http://localhost:2500}
      - BACKEND_API_VER=${BACKEND_API_VER:-/api/v1}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-supersecret123}
      - MODEL_FILE=${MODEL_FILE:-best.pt}
      - CONF_THRESHOLD=${CONF_THRESHOLD:-0.75}
      - MINIMUM_SIZE=${MINIMUM_SIZE:-460000}
      - YOLO_SKIP_FRAMES=${YOLO_SKIP_FRAMES:-1}
      # Garis capture (px, ruang STREAM). 0 = tanpa garis. Nilai awal saja —
      # yang dipakai sehari-hari diatur dari layar support konsol.
      - GARIS_CAPTURE=${GARIS_CAPTURE:-0}
      - SUMBU_GARIS=${SUMBU_GARIS:-tegak}
      - MODE_DEV=${MODE_DEV:-false}
      - ROI_X1=${ROI_X1:-0}
      - ROI_Y1=${ROI_Y1:-0}
      - ROI_X2=${ROI_X2:-0}
      - ROI_Y2=${ROI_Y2:-0}
      - STREAM_WIDTH=${STREAM_WIDTH:-1280}
      - STREAM_HEIGHT=${STREAM_HEIGHT:-720}
      - STREAM_FPS=${STREAM_FPS:-12}
      # Tebal bbox + ukuran label yang digambar RealtimeInspectionPipeline.draw_boxes().
      # Default = default kode; frame sensor 2448x2048 butuh jauh lebih besar (lihat .env).
      - BORDER_THICKNESS=${BORDER_THICKNESS:-2}
      - FONT_SCALE=${FONT_SCALE:-0.7}
      - FONT_THICKNESS=${FONT_THICKNESS:-2}
      - CAMERA_DEVICE_INDEX=0
      # Pilih kamera by-serial (stabil, cegah rebutan antar line). Kosong → fallback index.
      - CAMERA_SERIAL=${LINE_1_CAMERA_SERIAL:-}
      # Auto-load setting kamera (.mfs dari MVS) saat connect. Non-fatal kalau gagal.
      - CAMERA_FEATURE_FILE=${LINE_1_FEATURE_FILE:-config/camera/hikrobot.mfs}
      - MACHINE_ID=${LINE_1_MACHINE_ID:-d1f9c7b2-8e5a-4c3b-9a1e-2f6d4c8e7b01}
      # Sumber kamera line ini, disusun layar Support dan ditulis ke media.env.
      # Per line, bukan satu untuk semua: satu PC bisa menguji video di satu
      # line sementara dua lainnya memakai kamera sungguhan.
      - CAMERA_TYPE=${LINE_1_CAMERA_TYPE:-hikrobot}
      - CAMERA_WIDTH=${CAMERA_WIDTH:-2448}
      - CAMERA_HEIGHT=${CAMERA_HEIGHT:-2048}
      - CAMERA_FPS=${CAMERA_FPS:-20}
      # NAMA berkas di folder media, bukan path. Kode yang menggabungkannya.
      - MEDIA_FILE=${LINE_1_MEDIA_FILE:-}
      # Folder tempat MEDIA_FILE dicari. WAJIB ada di tiap line, bukan
      # cuma di konsol: tanpa ini `media_dir` turun ke `repo_root/media`,
      # yang di dalam container tidak ada. Untuk `video` akibatnya line
      # gagal buka berkas lalu jatuh ke CAMERA_DEVICE_INDEX — mencari
      # webcam yang tidak terpasang, mati, dan `restart: unless-stopped`
      # menyalakannya lagi selamanya. Terbukti di Lampung 2026-09-23:
      # `RuntimeError: Tidak bisa buka camera source: 2`.
      - MEDIA_DIR=${MEDIA_DIR:-/media}
      - MEDIA_ENV_PATH=${MEDIA_ENV_PATH:-/config/media.env}
      # Folder rekaman video developer (layar Rekam Video). Di luar
      # artifacts/ dengan sengaja: rekaman bukan bukti grading dan TIDAK ikut
      # retensi otomatis — dihapus manual oleh yang merekam.
      - REKAMAN_DIR=/app/videos
      - CAMERA_VIDEO_LOOP=${LINE_1_VIDEO_LOOP:-false}
      - UPLOAD_MINUTE=${UPLOAD_MINUTE:-0}
      - UPLOAD_MAX_ITEMS_PER_TICK=${UPLOAD_MAX_ITEMS_PER_TICK:-2000}
      - UPLOAD_RETENTION_DAYS=${UPLOAD_RETENTION_DAYS:-7}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_BUCKET=${R2_BUCKET:-}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL:-}
      - UPLOAD_API_URL=${UPLOAD_API_URL:-}
      - UPLOAD_API_SECRET=${UPLOAD_API_SECRET:-}
      # Langganan. Compose ini menyebut env satu per satu, jadi tanpa baris di
      # sini mengisinya di .env sama sekali tidak berefek. LICENSE_TOKEN dipasang
      # `palmgrade license <token>` dan baru nempel saat container DIBUAT ULANG.
      - LICENSE_ENABLED=${LICENSE_ENABLED:-false}
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY:-}
      - LICENSE_TOKEN=${LICENSE_TOKEN:-}
      # PLC / ODOT CN-8031 (Modbus-TCP) — mati default, cuma PC pabrik yang menyalakan.
      - PLC_ENABLED=${PLC_ENABLED:-false}
      - PLC_HOST=${PLC_HOST:-}
      - PLC_PORT=${PLC_PORT:-502}
      - PLC_UNIT_ID=${PLC_UNIT_ID:-1}
      # Properti fisik line ini (coil map skematik) — sengaja literal, bukan dari
      # env, karena tidak boleh berbeda antar PC.
      - PLC_COIL_BASE=0
      # Coil 9 = HEARTBIT PC, satu-satunya bit alive di skematik ODOT.
      - PLC_COIL_ALIVE=9
      # Piston manual line 1 — coil 10 (X030A), konfirmasi DI 12 (Y031C).
      - PLC_COIL_MANUAL=10
      - PLC_DI_MANUAL=12
      - PLC_ALIVE_TOGGLE_MS=${PLC_ALIVE_TOGGLE_MS:-0}
      - PLC_PULSE_MS=${PLC_PULSE_MS:-200}
      - PLC_PULSE_GAP_MS=${PLC_PULSE_GAP_MS:-100}
      - PLC_QUEUE_MAX=${PLC_QUEUE_MAX:-1}
      - PLC_POLL_MS=${PLC_POLL_MS:-200}
      - PLC_DI_COUNT=${PLC_DI_COUNT:-16}
      - DEBUG_MODEL_OUTPUT=${DEBUG_MODEL_OUTPUT:-}
    volumes:
      - .:/app
      - /app/.venv
      - ./artifacts/line-1:/app/artifacts
      - ./state/line-1:/app/state
      - ./models:/app/models:ro
      - ./engines:/app/engines
      # Folder media utuh, bukan bind-mount per berkas: itulah yang membuat
      # ganti berkas cukup restart, bukan `docker compose up` ulang.
      - ./media:/media:ro
      # Setelan sumber kamera, dibaca line SENDIRI saat boot. Environment
      # container beku sejak container dibuat, jadi tombol Simpan & Restart
      # (yang cuma menyuruh proses keluar) tidak akan pernah menurunkan
      # setelan baru lewat environment. `:ro` — line membaca, konsol menulis.
      - ./media.env:/config/media.env:ro
      # Rekaman video developer. BUKAN :ro — line yang menulis ke sini.
      - ./videos:/app/videos

