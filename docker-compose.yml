      - PLC_PORT=${PLC_PORT:-502}
      - PLC_UNIT_ID=${PLC_UNIT_ID:-1}
      # Properti fisik line ini (coil map skematik) — sengaja literal, bukan dari
      # env, karena tidak boleh berbeda antar PC.
      - PLC_COIL_BASE=6
      # Kosong: coil 12 ditandai SPARE di skematik ODOT.
      - PLC_COIL_ALIVE=
      # Piston manual line 3 — coil 12, konfirmasi DI 14.
      - PLC_COIL_MANUAL=12
      - PLC_DI_MANUAL=14
      - PLC_ALIVE_TOGGLE_MS=${PLC_ALIVE_TOGGLE_MS:-0}
      - PLC_PULSE_MS=${PLC_PULSE_MS:-200}
      - PLC_PULSE_GAP_MS=${PLC_PULSE_GAP_MS:-100}
      - PLC_QUEUE_MAX=${PLC_QUEUE_MAX:-1}
      - PLC_POLL_MS=${PLC_POLL_MS:-200}
      - PLC_DI_COUNT=${PLC_DI_COUNT:-16}
      - DEBUG_MODEL_OUTPUT=${DEBUG_MODEL_OUTPUT:-}
    volumes:
      - .:/app
      - /app/.venv
      - ./artifacts/line-3:/app/artifacts
      - ./state/line-3:/app/state
      - ./models:/app/models:ro
      - ./engines:/app/engines
      # Folder media utuh, bukan bind-mount per berkas: itulah yang membuat
      # ganti berkas cukup restart, bukan `docker compose up` ulang.
      - ./media:/media:ro
      # Setelan sumber kamera, dibaca line SENDIRI saat boot. Environment
      # container beku sejak container dibuat, jadi tombol Simpan & Restart
      # (yang cuma menyuruh proses keluar) tidak akan pernah menurunkan
      # setelan baru lewat environment. `:ro` — line membaca, konsol menulis.
      - ./media.env:/config/media.env:ro
      # Rekaman video developer. BUKAN :ro — line yang menulis ke sini.
      - ./videos:/app/videos

  # Instance ke-4 dari image yang SAMA: konsol operator offline (§4 rencana
  # PalmOS). Tanpa kamera, tanpa GPU, tanpa PLC — supaya satu line kamera yang
  # mati tidak ikut menjatuhkan layar operator. Tiga line mengirim event ke
  # sini dengan menyetel BACKEND_URL=http://localhost:8000 di .env pabrik;
  # dengan begitu palmgrade_api lokal tidak perlu hidup lagi (7 → 4 container).
  console:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TORCH_VARIANT: cu126
    image: palmgrade-vision:latest
    container_name: palmgrade_console
    restart: unless-stopped
    network_mode: host
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,os;urllib.request.urlopen('http://localhost:'+os.environ['APP_PORT']+'/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    environment:
      - APP_MODE=console
      - APP_ENV=${APP_ENV:-production}
      - APP_PORT=8000
      # APP_VERSION sengaja TIDAK disebut di sini: Dockerfile sudah mem-bake tag
      # rilis ke image (`ENV APP_VERSION`), dan menyetelnya di compose akan
      # menimpanya. Di PC pabrik `.env` tidak memuat variabel itu — tidak ada
      # yang mengisinya — jadi `${APP_VERSION:-unknown}` membuat layar Versi
      # menjawab "unknown" selamanya, persis saat support menanyakannya lewat
      # AnyDesk. Dijaga `tests/unit/test_compose_app_version.py`.
      - BACKEND_API_VER=${BACKEND_API_VER:-/api/v1}
      # Dipakai dua arah: memverifikasi event masuk dari line (x-webhook-secret)
      # dan meneruskan perintah ke line (x-internal-secret). Satu nilai, sama
      # persis dengan yang dipakai tiga line.
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-supersecret123}
      # Batas hari kerja (§6.1). Pabrik jalan ~20 jam/hari lewat tengah malam,
      # jadi tanggal TIDAK boleh diturunkan dari UTC.
      - FACTORY_TZ=${FACTORY_TZ:-Asia/Jakarta}
      - CONSOLE_SYNC_INTERVAL_S=${CONSOLE_SYNC_INTERVAL_S:-300}
      - CONSOLE_LINE_HOST=${CONSOLE_LINE_HOST:-http://localhost}
      # Dua akun bawaan (operator@autograde.local + support@autograde.local). Isinya
      # HASH, bukan sandi — bikin dengan `make hash-sandi`. Default-nya nilai yang
      # ditanam di image; `.env` menimpanya kalau PKS ini pakai sandi lain.
      # ⚠️ Compose memakan `$`: tulis `$$` untuk satu `$`, kalau tidak hash-nya
      # terpotong dan akunnya ditolak (sengaja, dengan pesan error).
      - CONSOLE_DEFAULT_HASH=${CONSOLE_DEFAULT_HASH:-}
      - CONSOLE_SUPPORT_HASH=${CONSOLE_SUPPORT_HASH:-}
      # AutoERP link. Empty ERP_URL switches it off (the default); the operator
      # screen never depends on AutoERP being up.
      - ERP_URL=${ERP_URL:-}
      - ERP_API_KEY=${ERP_API_KEY:-}
      - ERP_API_SECRET=${ERP_API_SECRET:-}
      # Empty is correct on a single-company site: AutoERP then books against
      # its own default company.
      - ERP_COMPANY=${ERP_COMPANY:-}
      # Peran mana yang boleh datang dari AutoERP. Kosongkan untuk menolak semuanya.
      - ERP_ALLOWED_ROLES=${ERP_ALLOWED_ROLES:-support}
      # Berapa lama layar Log (support) menyimpan riwayat ERROR/WARNING.
      - LOG_RETENSI_HARI=${LOG_RETENSI_HARI:-180}
      # R2: tempat manifest per truk + viewer.html, bucket yang sama dengan foto
      # dari tiga line. R2_BUCKET kosong = tidak ada manifest, tidak ada detail_url.
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_BUCKET=${R2_BUCKET:-}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL:-}
      - LICENSE_TOKEN=${LICENSE_TOKEN:-}
      # ⚠️ Saklar dan kunci publik WAJIB ikut, bukan cuma tokennya. Konsol
      # membaca `LICENSE_ENABLED` untuk memutuskan gerbang lisensi menyala, dan
      # `LICENSE_PUBLIC_KEY` untuk memeriksa tanda tangannya. Token sampai tanpa
      # saklar = layar melapor "Lisensi: Mati" walau langganannya sah, dan banner
      # tidak pernah muncul untuk operator. Nol error. Terjadi di Lampung
      # 2026-09-22. `LICENSE_PUBLIC_KEY` boleh kosong — ada kunci bawaan image.
      - LICENSE_ENABLED=${LICENSE_ENABLED:-false}
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY:-}
      # Pemetaan machine_id → line, supaya event tahu dia dari line mana.
      # Nilai default sama persis dengan tiga service di atas.
      - LINE_1_MACHINE_ID=${LINE_1_MACHINE_ID:-d1f9c7b2-8e5a-4c3b-9a1e-2f6d4c8e7b01}
      - LINE_2_MACHINE_ID=${LINE_2_MACHINE_ID:-a7e2f4c9-3b6d-4e1a-8c5f-9d2b6a1e4f02}
      - LINE_3_MACHINE_ID=${LINE_3_MACHINE_ID:-ad5f7bb9-c06d-4e87-8282-ce450ae331ec}
      # Folder media + berkas setelan yang ditulis layar Support (media_env_service.py).
      - MEDIA_DIR=${MEDIA_DIR:-/media}
      - MEDIA_ENV_PATH=${MEDIA_ENV_PATH:-/config/media.env}
      # Jalur rekaman yang DITAMPILKAN di layar Rekam Video. Konsol tidak
      # menulis rekaman (itu urusan line) dan tidak mem-mount foldernya —
      # ia cuma perlu menyebutkan tempatnya. Yang berguna bagi teknisi yang
      # membuka PC pabrik lewat AnyDesk adalah jalur HOST, bukan `/app/videos`
      # yang cuma ada di dalam container line.
      - REKAMAN_TAMPIL=${REKAMAN_TAMPIL:-/opt/palmgrade/autograde/videos}
      - MEDIA_FILE=${MEDIA_FILE:-}
    volumes:
      - .:/app
      - /app/.venv
      - ./state/console:/app/state
      # Gambar tetap milik line-nya masing-masing — konsol cuma numpang baca.
      - ./artifacts/line-1:/app/artifacts/line-1:ro
      - ./artifacts/line-2:/app/artifacts/line-2:ro
      - ./artifacts/line-3:/app/artifacts/line-3:ro
      - ./media:/media:ro
      # Satu-satunya berkas host yang konsol boleh tulis. `.env` sengaja TIDAK
      # di-mount: ia memuat lisensi, R2, dan webhook secret.
      - ./media.env:/config/media.env
