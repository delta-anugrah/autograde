# Tooling config untuk autograde. TIDAK dipakai untuk build/install
# (runtime tetap via requirements.txt + Dockerfile). Hanya konfigurasi test & lint.

[tool.pytest.ini_options]
# src-layout: import `palmgrade.*` tanpa perlu set PYTHONPATH manual.
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
# CI menjalankan `ruff check src/ tests/` (batch 4.4). Ruff tidak mengimpor modul, jadi kode
# yang butuh torch/cv2/SDK tetap dilint. Yang dikecualikan cuma kode vendor/skrip di luar paket.
extend-exclude = ["sdk", "cli", "scripts"]

[tool.ruff.lint]
# Set konservatif supaya tidak bikin noise di kode yang sudah ada:
#   E,F = pyflakes + pycodestyle errors; I = import sorting; UP = pyupgrade; B = bugbear.
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",  # line-length ditangani formatter, jangan gagal-kan CI karenanya
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
